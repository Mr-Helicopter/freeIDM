[package]
name = "idm-cli"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "idm"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
idm-core = { path = "../idm-core" }
indicatif = "0.18.6"
reqwest = { version = "0.13.5" }
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.2", features = ["full"] }
