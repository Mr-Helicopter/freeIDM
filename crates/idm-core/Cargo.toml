[package]
name = "idm-core"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
libc = "0.2.190"
percent-encoding = "2.3.2"
reqwest = { version = "0.13.5", features = ["stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tokio = { version = "1.53.2", features = ["full"] }
uuid = { version = "1.10", features = ["v4"] }
